# Lynceus detection rules.
# Each rule is evaluated against every supported device observation. See README
# for the schema; rule_type is one of watchlist_mac, watchlist_oui,
# watchlist_ssid, watchlist_mac_range, ble_uuid,
# watchlist_ble_manufacturer_id, watchlist_drone_id_prefix,
# watchlist_ble_local_name, or new_non_randomized_device.
rules:
  # Hak5 WiFi Pineapple uses a recognizable OUI prefix, flag it on sight.
  - name: hak5_pineapple_oui
    rule_type: watchlist_oui
    severity: high
    patterns: ["00:13:37"]
    description: Hak5 WiFi Pineapple OUI prefix

  # Specific MACs known to be hostile (replace with your own intel).
  - name: known_bad_mac
    rule_type: watchlist_mac
    severity: high
    patterns: ["DE:AD:BE:EF:00:01"]

  # SSIDs commonly used for evil-twin / captive-portal attacks.
  - name: rogue_ssids
    rule_type: watchlist_ssid
    severity: med
    patterns: ["FreeAirportWiFi", "attwifi-rogue"]

  # Catch any first-time-seen device that is NOT using a randomized MAC,
  # i.e. a device that didn't bother hiding its real OUI.
  - name: new_device_alert
    rule_type: new_non_randomized_device
    severity: low

  # Example of a rule kept in the file but switched off via `enabled: false`.
  - name: temporarily_disabled
    rule_type: watchlist_mac
    severity: low
    patterns: ["11:22:33:44:55:66"]
    enabled: false

  # watchlist_mac_range delegates matching to the watchlist DB. Patterns MUST
  # be empty, the rule fires when an observed MAC falls inside any imported
  # mac_range row's /28 or /36 prefix (populated by lynceus-import-argus).
  # Severity is sourced from the matched DB row, NOT from the `severity`
  # field below (which is ignored for this rule_type). For Argus-imported
  # rows the per-row severity comes from device_category → severity defaults
  # in import_argus.py; for the 17,786 IEEE-registry rows currently shipped,
  # device_category is "unknown" which maps to "low" by default.
  #
  # Uncomment to enable.
  #
  # - name: argus_mac_range
  #   rule_type: watchlist_mac_range
  #   severity: low  # ignored, actual severity comes from the matched row
  #   patterns: []
  #   description: "Argus mac_range corpus, IEEE registry sub-allocations"

  # ---- DB-delegation entries for the equality-shaped watchlist types ----
  #
  # The four entries below extend the empty-patterns-delegates-to-DB
  # semantic from watchlist_mac_range to watchlist_mac, watchlist_oui,
  # watchlist_ssid, and ble_uuid. Each enables alert-firing for every
  # matching row of that pattern_type currently in the watchlist DB,
  # the 63 rows shipped via the bundled default_watchlist.csv plus
  # whatever lynceus-import-argus has populated. See the CHANGELOG
  # entry for 0.4.0-rc4 ("watchlist delegation extension") and the
  # Part 2 entry it builds on for the architectural background.
  #
  # Same contract as watchlist_mac_range: patterns: [] = delegate to
  # the imported DB rows; the `severity` field below is IGNORED for
  # the delegation case (the emitted alert's severity comes from the
  # matched DB row's severity column, populated by the importer from
  # device_category via DEFAULT_CATEGORY_SEVERITIES in import_argus.py:
  # alpr / imsi_catcher / hacking_tool default to "high",
  # body_cam / drone / gunshot_detect / in_vehicle_router to "med",
  # and "unknown" / unspecified to "low"). Default is OFF; uncomment
  # to enable.
  #
  # Backward compat: any pre-existing entry of these types with a
  # non-empty `patterns:` list keeps its original in-memory match
  # semantic (severity sourced from the rule). The empty-patterns
  # idiom only activates the DB delegation path for new entries,
  # existing operator deployments see zero behavioral change unless
  # they deliberately uncomment one of the entries below.
  #
  # argus_mac is enabled by default from 1.0.0, which is the release this
  # config ships in -- the entry is no longer ahead of the tag. It was
  # commented out,
  # and the consequence was not the intended conservatism: the
  # /devices/<mac>/watchlist button writes a watchlist row, turns the
  # panel green, and promises "It will raise alerts on every future
  # sighting" -- while no enabled rule consulted the table, so the next
  # poll ignored it. Measured on the shipped config: one watchlist row,
  # zero rule hits. See scripts/audit/repro_watchlist_gap.py.
  #
  # This deliberately breaks the backward-compat promise stated below,
  # for the exact-MAC case only. The promise protected a behaviour
  # nobody wants -- a watchlist that does not watch.
  - name: argus_mac
    rule_type: watchlist_mac
    severity: low  # ignored, actual severity comes from the matched row
    patterns: []
    description: "Argus + bundled exact-MAC watchlist"
  #
  # - name: argus_oui
  #   rule_type: watchlist_oui
  #   severity: low  # ignored, actual severity comes from the matched row
  #   patterns: []
  #   description: "Argus + bundled OUI watchlist"
  #
  # argus_ssid below is enabled by default in rc6+: the bundled
  # default_watchlist.csv now ships with Argus SSID rows (5 ssid_exact
  # + 5 ssid_pattern at the 2026-05-17 snapshot, all Flock-related),
  # so the rule produces real alerts out of the box. The
  # watchlist_ssid DB-delegation branch dispatches BOTH pattern_types:
  # 'ssid' (case-sensitive exact match) consulted first, then
  # 'ssid_pattern' (case-insensitive substring) as a fallback.
  # Operators see one rule_type; the DB carries both shapes.
  - name: argus_ssid
    rule_type: watchlist_ssid
    severity: low  # ignored, actual severity comes from the matched row
    patterns: []
    description: "Argus + bundled SSID watchlist (exact + substring)"
  #
  # - name: argus_ble_uuid
  #   rule_type: ble_uuid
  #   severity: low  # ignored, actual severity comes from the matched row
  #   patterns: []
  #   description: "Argus + bundled BLE service-UUID watchlist"

  # ---- Two newer delegation entries (rc5+) ----
  #
  # ble_manufacturer_id matches the Bluetooth SIG 16-bit Company
  # Identifier extracted from BTLE advertisement payloads (e.g.
  # 0x004C for Apple). drone_id_prefix matches ANSI/CTA-2063-A
  # Remote-ID serial prefixes broadcast by drones operating under
  # FAA / EU Remote-ID rules.
  #
  # CAVEAT: both rule_types depend on Kismet observation surface
  # that is currently unverified against a live capture. Until the
  # Kismet field paths in src/lynceus/kismet.py (probe tables
  # _BLE_MANUFACTURER_ID_PATHS and _DRONE_ID_PATHS) are confirmed
  # to match a real Kismet emission, observations will carry None
  # for these fields and the rules below will fire zero alerts on
  # real hardware. The watchlist data still lands in the DB and
  # appears in the /watchlist UI; alerting will start firing once
  # the Kismet half is wired up. See the rc5 CHANGELOG entry.
  #
  # ---- Measuring one of these before you enable it (shadow mode) ----
  #
  # The reason the two rules below stay commented is an alert-storm argument:
  # the bundled watchlist carries 4,684 rows the ble_manufacturer_id rule
  # consumes, of which 4 have an actionable device_category. That is 0.085%
  # signal, counted against the SHIPPED corpus (measured 2026-08-26) -- not
  # against your airspace. Nobody can tell you what it would do on YOUR site.
  #
  # Shadow mode answers that. Uncomment a rule and add `shadow: true`:
  #
  #   - name: argus_ble_manufacturer_id
  #     rule_type: watchlist_ble_manufacturer_id
  #     severity: low
  #     patterns: []
  #     shadow: true          # <-- evaluated, counted, alerts on NOTHING
  #
  # Restart the daemon, leave it a day, then read the counts. The rule is
  # evaluated in full against live traffic and cannot produce an alert or a
  # notification while `shadow: true` is set.
  #
  #     journalctl -u lynceus.service | grep 'shadow rule'
  #
  # ⛔ READ THE DENOMINATOR, NOT JUST THE COUNT. A result of zero means one of
  # two opposite things, and they demand opposite responses:
  #
  #   0 hits, and the field WAS seen      -> genuinely quiet here. Safe to
  #                                          enable, on this site, for now.
  #   0 hits, and the field was NEVER seen -> the rule is inert. Enabling it
  #                                          buys you nothing and hides the gap.
  #
  # The second is not hypothetical for these two rule_types. The CAVEAT above
  # is live: the Kismet field paths are unverified against a real capture, so
  # `ble_manufacturer_id` may read None on every observation you have. The
  # daemon therefore also counts how many observations carried each field, and
  # logs it beside the hit count. If the field was never seen, you have
  # measured the plumbing, not the airspace.
  #
  # ⚠️ A quiet week is evidence about your site and your week, not a property
  # of the rule. Re-measure after you move, and after a watchlist refresh.
  #
  # - name: argus_ble_manufacturer_id
  #   rule_type: watchlist_ble_manufacturer_id
  #   severity: low  # ignored, actual severity comes from the matched row
  #   patterns: []
  #   description: "Argus BLE manufacturer-ID watchlist (Bluetooth SIG company IDs)"
  #
  # - name: argus_drone_id_prefix
  #   rule_type: watchlist_drone_id_prefix
  #   severity: low  # ignored, actual severity comes from the matched row
  #   patterns: []
  #   description: "Argus drone Remote-ID prefix watchlist (ANSI/CTA-2063-A)"

  # ---- Apple Continuity device class ----
  #
  # Alerts on Apple devices whose Continuity payload decodes to a Find My
  # advert. Unlike the watchlist_* rules above this one is NOT delegated:
  # the class is decoded from the advertisement itself
  # (src/lynceus/ble_continuity.py), so patterns are required and the
  # severity here is the one that fires.
  #
  # Requires the passive BLE bridge (ble_bridge.enabled), the Kismet
  # classic-HCI path surfaces no advertisement payload to decode, so this
  # rule is inert without it.
  #
  # Find My separation state is three-valued and decoded from the advert's
  # STRUCTURE, not a status bit (the earlier status-bit guess was retired by
  # the 2026-08-01 rig capture, see ble_continuity.py):
  #
  #   find_my_separated  long form, carries rotating key material, the
  #                      device is not near its owner. The signal you want.
  #   find_my_paired     short form, near its owner. Every passer-by's own
  #                      tracker looks like this; matching it is a noise
  #                      generator, which is why it is not listed below.
  #   find_my            a Find My advert in neither observed form. Unknown
  #                      separation, deliberately NOT treated as benign.
  #
  # Match both listed classes: dropping 'find_my' would silently discard
  # every advert form the rig has not seen yet.
  #
  # ENABLED BY DEFAULT, and that costs a Kismet-only deployment nothing.
  #
  # This rule needs no `ble_bridge.enabled` gate and must not be given one.
  # Nothing but the passive BLE bridge ever populates `ble_device_class` --
  # the Kismet classic-HCI path surfaces no advertisement payload to decode
  # and leaves the column NULL (see db.py, count_devices_by_ble_device_class;
  # kismet.py never assigns the field, it only blanks it for non-BLE
  # observations). So "on when the bridge is on" IS this rule being present:
  # with the bridge off it cannot fire, by construction rather than by policy.
  #
  # ⇒ Unlike argus_mac, enabling this does NOT break a backward-compatibility
  # promise -- it satisfies one structurally. The zero-behavioural-change
  # guarantee is asserted, not assumed: see the bridge-off test in
  # tests/test_find_my_alerting.py, which fails if any non-bridge path ever
  # starts populating the class.
  #
  # ⚠️ The backward-compat paragraph further up this file is scoped to the
  # DELEGATION entries and the empty-patterns idiom; it never covered this
  # rule type. Do not edit it on this rule's account.
  - name: apple_find_my
    rule_type: ble_device_class
    severity: med
    patterns: [find_my_separated, find_my]
    description: "Apple Find My tracker away from its owner"

  # ---- ble_local_name delegation (v0.6.1+) ----
  #
  # Matches the BLE Core Spec §4.5.2 Complete Local Name (Flock
  # Safety device names: 'Penguin', 'FS Ext Battery', 'Flock',
  # 'FLOCK', 'Flock-*' variants). Equality at the string level,
  # case-sensitive per spec. Depends on capture.ble_friendly_names
  # being enabled in lynceus.yaml; without it the obs.ble_local_name
  # field stays None and this rule fires zero alerts. Default is
  # OFF (privacy-conservative posture). Uncomment to enable.
  #
  # - name: argus_ble_local_name
  #   rule_type: watchlist_ble_local_name
  #   severity: low  # ignored, actual severity comes from the matched row
  #   patterns: []
  #   description: "Argus BLE local-name watchlist (Flock Safety device names)"
