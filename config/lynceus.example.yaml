# Lynceus configuration sample.
# Copy this file to lynceus.yaml and customize. All fields have sensible
# defaults, only override what you actually need.

# --- Kismet source ---

# URL of the Kismet REST API. Override per deployment.
kismet_url: http://127.0.0.1:2501

# Kismet API key (cookie). Typically set in production deployments where
# Kismet is auth-protected. Leave null for unauthenticated local use.
kismet_api_key: null

# Optional: path to a JSON fixture matching the Kismet device-list shape.
# When set, Lynceus uses FakeKismetClient and never makes HTTP calls, useful
# for offline development and tests. Leave commented out in production.
# kismet_fixture_path: tests/fixtures/kismet_devices.json

# Optional: only relevant when kismet_fixture_path is set. Shifts every
# timestamp in that fixture by one constant offset so it reads as a fresh
# capture instead of a stale one. Used by development and demo setups, not
# by real deployments. Leave commented out in production.
# kismet_fixture_shift_to_now: true

# --- Storage ---

# Path to the SQLite database file. Typically overridden to a stable
# location (e.g. /var/lib/lynceus/lynceus.db) on the Pi.
db_path: lynceus.db

# --- Location ---
# Identifier and human label for sightings recorded by this instance.
# Typically overridden to identify the physical install (e.g. 'home', 'office').
location_id: default
location_label: Default Location

# --- Polling ---

# Seconds between Kismet polls. Minimum 5; values below are rejected.
poll_interval_seconds: 60

# --- Logging ---

# One of DEBUG, INFO, WARNING, ERROR.
log_level: INFO

# --- Detection rules and allowlist ---

# Path to the rules YAML (see config/rules.yaml). When unset, no rules
# are loaded and no alerts are generated.
# rules_path: config/rules.yaml

# Path to the allowlist YAML (see config/allowlist.yaml). Devices matched
# here are exempted from alerting. When unset, nothing is allowlisted.
# allowlist_path: config/allowlist.yaml

# Where the daemon writes the suppressions you make from the web UI
# ("allowlist this device", "snooze"). Leave it unset unless you have a
# reason: the default puts it in the STATE directory beside db_path, which
# is the one place every install scope grants the daemon write access.
#
# It is daemon-written state, not operator config, which is why it does NOT
# live beside allowlist_path. On a --system install that would be
# /etc/lynceus, and the units deliberately keep the daemon out of your
# config directory.
#
# Upgrading from a version that wrote it beside allowlist_path needs no
# action: that file keeps being read until the first suppression you make
# from the UI, which copies its entries across.
# ui_allowlist_path: /var/lib/lynceus/allowlist_ui.yaml

# Path to operator-local severity tuning (vendor overrides, per-category
# severity bumps, the confidence-downgrade threshold, and the Argus CSV
# schema-version accept-list). Read by lynceus-import-argus --override-file,
# so edits apply at the next import rather than at daemon restart.
# severity_overrides_path: config/severity_overrides.yaml

# Suppress repeated alerts for the same (rule, mac) within this many seconds.
# Set to 0 to disable dedup (every hit becomes an alert).
alert_dedup_window_seconds: 3600

# --- Heartbeat (dead-man's switch) ---

# Every other failure mode in lynceus raises an alert. What is left is the
# daemon dying or notification delivery breaking -- and there your only symptom
# is silence, which looks exactly like "nothing is out there". Turning this on
# makes that silence meaningful: if the heartbeat stops arriving, something is
# wrong. It also reports UNHEALTHY rather than claiming everything is fine when
# it can see the pipeline is broken. Requires ntfy to be configured.
heartbeat_enabled: false

# How often to send it. Measured from the last SUCCESSFULLY DELIVERED
# heartbeat, so a failed send is retried rather than costing a whole interval.
heartbeat_interval_hours: 24

# --- Notifications ---

# ntfy notification settings (optional, leave unset to disable)
# ntfy_url: https://ntfy.sh         # Or your self-hosted instance
# ntfy_topic: my-lynceus-alerts       # Required if ntfy_url is set
# ntfy_auth_token: xxx              # Optional bearer token for protected topics

# --- Web UI (lynceus-ui) ---

# Host interface the UI binds to. Default 127.0.0.1 (loopback only). To
# expose the UI to other machines on the LAN, change this AND set
# ui_allow_remote: true (binding non-loopback without that flag is a footgun
# and is rejected at config load).
ui_bind_host: 127.0.0.1

# TCP port the UI listens on. Must be in [1, 65535].
ui_bind_port: 8765

# Permit binding to a non-loopback address. Leave false on a single-Pi
# install. Required true for any setup where a separate machine will
# fetch the UI.
#
# A non-loopback bind ALSO requires a web UI password: lynceus-ui refuses to
# start without one and prints how to set it. See ui_auth_path below.
#
# Note what a password does not do: lynceus serves no TLS, so over a plain
# HTTP bind the password and its session cookie cross the network in the
# clear. An SSH tunnel or a private network such as Tailscale stays the
# supported remote path, and both encrypt the hop this one does not.
ui_allow_remote: false

# Where the web UI password hash is stored. Commented out means "derive it",
# which puts ui_auth.json in the state directory beside the database.
#
# ⚠️ This names the FILE. It is not the password and it is not a secret --
# write the file with:
#
#     lynceus-ui-passwd --config /etc/lynceus/lynceus.yaml
#
# With no such file the UI runs unauthenticated, which is the default and is
# fine for a loopback single-operator install. Setting or changing a password
# takes effect at the next lynceus-ui restart, not immediately.
# ui_auth_path: /var/lib/lynceus/ui_auth.json

# --- Multi-source / multi-adapter ---

# Inclusive filter on Kismet source (adapter) names. When set, only
# observations seen by at least one of the listed sources are processed;
# all others are silently dropped (DEBUG-logged). Source names are matched
# exactly against the "kismet.common.seenby.source" field reported by Kismet.
# Leave unset to accept observations from every source.
# kismet_sources:
#   - alfa-2.4ghz
#   - builtin-bt

# Per-source location override. Maps Kismet source names to location_id
# values; sightings observed by a matching source are recorded under that
# location_id (rather than the global location_id above). Sources not
# present here fall back to location_id. Source name matching is exact.
# kismet_source_locations:
#   alfa-2.4ghz: wifi-corner
#   builtin-bt: bt-corner

# Drop observations weaker than this RSSI threshold (in dBm; values must be
# in [-120, 0]). Observations with no RSSI report (rssi=None) are kept
# regardless. Leave unset to disable RSSI filtering.
# min_rssi: -85

# HTTP timeout (seconds) for all Kismet REST calls. Must be > 0 and <= 120.
kismet_timeout_seconds: 10.0

# Probe Kismet's /system/status.json once at poller startup; on failure,
# Poller.__init__ raises and the daemon exits immediately. Set to false
# to skip the check (e.g. when starting lynceus before kismet is ready).
kismet_health_check_on_startup: true

# --- Tier 1 passive metadata capture ---
#
# Lynceus is a tool to *detect* surveillance, not to become surveillance.
# These toggles control whether two pieces of broadcast metadata get
# stored on the device row. Both columns are NULL when their toggle is
# off, and the poller does not even read the underlying Kismet field,
# opt-out means the data never enters the lynceus process.
capture:
  # Wi-Fi clients leak their probe-request SSID lists (e.g. SSIDs of
  # networks they have previously connected to). Capturing this list is
  # useful for triage, you can spot a device probing a coffee-shop SSID
  # in your living room, but it is also surveillance-grade telemetry
  # about other people's devices. Default OFF; set true only if you
  # accept the privacy posture.
  probe_ssids: false
  # BLE devices broadcast a friendly name in the GAP advertisement
  # (e.g. "Alex's AirPods", "Tile_a1b2"). This is broadcast with intent
  # and is more useful than harmful for triage. Default ON.
  ble_friendly_names: true

# --- Passive BLE bridge (OFF by default) ---
#
# This is a CAPTURE PATH OF ITS OWN, not a decoder running over Kismet's
# data. Kismet's classic Bluetooth datasource hands over no advertisement
# payload, so service UUIDs, company ids and Remote-ID serials never reach
# the matchers. The bridge opens its own passive bleak scan to feed them.
#
# It also needs the `bleak` library, which is an OPTIONAL extra that a
# default install does not include:
#
#     pip install 'lynceus[ble]'
#
# Without it an enabled bridge logs one warning at startup and then captures
# nothing, which looks exactly like a working bridge hearing nothing. This is
# the readiness failure you get without misconfiguring anything.
#
# Consequence: it needs a Bluetooth adapter Kismet is NOT already capturing
# on. Kismet holds an adapter for the lifetime of its daemon. Several
# configurations make an enabled bridge silently useless or noisy --
# adapter contention, a kismet_sources list missing the bridge's own
# "ble:<adapter>" provenance, a raw company-id rule that alerts on a
# whole vendor, and a bridge whose decoded class no enabled rule
# consumes, which alerts on nothing at all. `lynceus-setup` and
# /settings check each of these and print the fix.
#
# ⚠️ Deliberately not a COUNT. This sentence said "three" while listing
# three and then claiming `lynceus-setup` "checks all four", and both
# numbers were wrong again the moment a check was added. A list that
# names the cases cannot drift out of step with itself.
#
# See docs/CONFIGURATION.md before enabling.
ble_bridge:
  enabled: false
  # HCI adapter to scan on. Must not be one Kismet is capturing on.
  adapter: hci1
  # Bridge tick interval in seconds, independent of poll_interval_seconds.
  # Minimum 1. Leave unset to inherit poll_interval_seconds.
  # flush_interval: 60

# --- Observation history retention ---

# Delete sightings older than this many days.
#
# DESTRUCTIVE AND IRREVERSIBLE. Left unset (null) nothing is ever pruned,
# which is what every Lynceus install has always done -- an upgrade must not
# silently discard your observation history.
#
# Why you might set it: at a 60s poll interval one continuously-present device
# adds ~1,440 rows a day, so this table grows without bound and eventually
# fills a Pi. Alerts are never touched; they outlive the sightings behind them.
#
# Must be >= co_observation.window_days when that panel is enabled, or the
# panel would claim a period the database no longer covers.
# sightings_retention_days: 90

# --- Co-observation explorer ---

# Read-only panel: which other devices keep turning up at the same time as
# this one. Adds no capture path, raises no alerts, changes no schema.
#
# It makes no statistical claim. Sensor uptime is not recorded anywhere, so
# absence of data cannot be told apart from absence of a device, and no score
# would be defensible. The panel shows counts, not judgements.
#
# `enabled` is a SECURITY control, not a preference: iterating the route
# across every MAC reconstructs an association graph, and a stolen session can
# request thousands of endpoints even though each page shows 25. A capability
# that is off cannot be enumerated. Leave it off unless you need it.
#
# See docs/CONFIGURATION.md before enabling.
co_observation:
  enabled: false
  # How far back to look. sightings is never pruned, so this bounds the scan.
  window_days: 30
  # W: two sightings at one location within this many seconds are
  # "co-observed". The UI offers 1/5/15-minute presets.
  proximity_seconds: 300
  # Unseen for longer than this starts a new observation run.
  gap_seconds: 900
  # Candidates per request. Truncation is shown, never silent.
  max_candidates: 25

# --- Alert-time evidence snapshots ---

# Capture the full Kismet device record (subject to the capture.* toggles
# above) plus RSSI history when an alert fires. Storage grows with alert
# volume; set false on a storage-constrained Pi.
evidence_capture_enabled: true

# How long evidence rows survive before the daily prune deletes them.
# Range [1, 3650].
evidence_retention_days: 90

# Store the OPERATOR's GPS fix on evidence rows. Kismet's geopoint is the
# RECEIVER's location, not the observed device's, so enabling this builds a
# high-resolution log of where you have been, retained for
# evidence_retention_days. Independent of evidence_capture_enabled and
# opt-in for that reason.
evidence_store_gps: false

# --- Watchlist freshness ---

# Age (days) at which /settings flags the imported watchlist as stale. The
# bundled lynceus-refresh.timer runs weekly, well inside this window.
watchlist_staleness_warn_days: 30
