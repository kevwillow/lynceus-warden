# Lynceus CI.
#
# The README invites readers to check its claims by running the suite, and
# until now nothing ran it automatically. Actions is free with unlimited
# minutes on public repositories, which this is.
#
# ⚠️ The traps below are the ones .claude/gates.md records as having cost real
# time locally. They are encoded here deliberately so they stop being tribal
# knowledge that only survives in one person's head.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite is ~18 minutes. Superseding a run on the same ref wastes nothing
# useful, so cancel the older one rather than queueing both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Spelled out with `include` rather than crossed, because the third leg
        # is not a version at all -- it is an ARCHITECTURE, and a full cross
        # product would buy two more x86 runs nobody needs.
        #
        # 3.11 is the floor declared in pyproject (requires-python >=3.11) and
        # is the one that matters: a 3.12-only syntax regression passes on a
        # dev box running 3.12 and breaks every 3.11 user.
        #
        # ⭐ The arm64 leg is the one this project was missing. Lynceus targets
        # a Raspberry Pi; every run before this one was x86-64, so the actual
        # deployment architecture was never exercised by anything but a human
        # with a Pi on the desk. arm64 runners are free on public repos.
        include:
          - runner: ubuntu-latest
            python-version: "3.11"
            coverage: true
          - runner: ubuntu-latest
            python-version: "3.12"
            coverage: false
          - runner: ubuntu-24.04-arm
            python-version: "3.11"
            coverage: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ⚠️ tests/test_packaging.py skips itself with "python not on PATH" when
      # the interpreter is not reachable as bare `python`. setup-python does
      # provide it, but assert rather than assume: locally this skip reads as
      # a skip count of 2, which looks identical to the lost-Argus-gate
      # failure below while being an entirely different cause.
      - name: Assert the packaging test can run
        run: |
          command -v python || { echo "::error::python not on PATH; test_packaging will skip"; exit 1; }
          python -c "import build" || { echo "::error::build module missing; test_packaging will skip"; exit 1; }

      - name: Lint
        run: ruff check .

      # ⛔ Deliberately NOT gated on `ruff format --check`. It is red by design
      # (see .claude/gates.md and the Makefile): reformatting the repo wholesale
      # would bury real changes under whitespace. A permanently-red gate is a
      # gate people stop reading. Reported here for visibility only.
      - name: Formatter drift (informational, never fails the build)
        continue-on-error: true
        run: ruff format --check . || true

      # ⚠️ The cross-repo Argus test reads $LYNCEUS_ARGUS_CSV, an export from a
      # SIBLING repository that CI does not and should not have. It skips
      # itself here, so CI's expected skip count is higher than a local run's.
      # `-ra` (set in pyproject addopts) prints every skip reason, so check
      # WHICH test skipped before concluding anything from a count.
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: pytest -q

      # ⚠️ Coverage runs on ONE leg, not all three. It is measurement, not a
      # second opinion: running it everywhere would add its overhead to every
      # leg to produce three copies of the same number.
      #
      # ⛔ 85 is a RATCHET AGAINST COLLAPSE, not a quality bar, and the number
      # was measured HERE rather than carried over from a dev box -- that box
      # skips the Bluetooth-directory test while this job skips the live-Argus
      # one, so the two measure slightly different line sets.
      #
      # Measured on this runner, 2026-08-19 at d2a1c3d: **86.86%** -- 1534 of
      # 11675 statements unreached. The floor sits 1.86 points under that, which
      # is about 217 statements of slack.
      #
      # ⚠️ Be honest about what that catches. A large module falling out of the
      # run -- `app.py` or `poller.py` ceasing to be imported because something
      # started failing silently -- moves the total by many points and trips
      # this. A SMALL module dropping out moves it by a fraction of a point and
      # does not. So this is a floor against collapse, not a per-module
      # guarantee; the per-module table in the run summary is what shows you a
      # single file going dark.
      #
      # ⚠️ And a covered line is not a tested one. This repo's own notes record
      # guards that matched a spelling rather than a behaviour; every one of
      # those counts as covered here.
      - name: Tests (with coverage)
        if: ${{ matrix.coverage }}
        run: |
          pytest -q \
            --cov=lynceus \
            --cov-report=term-missing:skip-covered \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --cov-fail-under=85

      # The per-module table is the actionable part -- it names which files the
      # suite never reaches, which is the question "how covered are we?"
      # actually needs answered. Put in the run summary so it needs no download.
      - name: Coverage summary
        if: ${{ matrix.coverage && !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          src = pathlib.Path("coverage.json")
          # ⚠️ This step runs on failure too (`!cancelled()`), which is exactly
          # when the table is most wanted -- a floor breach should still tell you
          # WHICH module fell. But if the run died before writing the report,
          # say so and exit clean: a diagnostic that raises on top of the real
          # failure buries the error that matters.
          if not src.exists():
              print("_No coverage.json — the test run did not get far enough to write one._")
              sys.exit(0)
          data = json.loads(src.read_text())
          total = data["totals"]["percent_covered"]
          print(f"### Coverage: {total:.1f}%\n")
          rows = sorted(
              ((f, m["summary"]) for f, m in data["files"].items()),
              key=lambda kv: kv[1]["percent_covered"],
          )
          print("| module | covered | missing |")
          print("| --- | --- | --- |")
          for name, s in rows[:25]:
              print(f"| `{name}` | {s['percent_covered']:.0f}% | {s['missing_lines']} |")
          print(f"\n_{len(rows)} modules measured; 25 least-covered shown._")
          PY

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.coverage && !cancelled() }}
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build wheel
        run: |
          python -m build --wheel
          ls -la dist/
