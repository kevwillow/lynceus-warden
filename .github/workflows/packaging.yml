# Does the built wheel actually work when installed?
#
# ⚠️ Why this is separate from the test suite. `pytest` runs against the source
# tree with `pythonpath = ["src"]`, so it can pass while the WHEEL is broken:
# a missing `package-data` entry, a console script pointing at a moved
# function, or a migration .sql that never got packaged are all invisible to
# it. Those failures land on the operator at install time, not on us at test
# time.
#
# `src/lynceus/migrations/*.sql` is the sharp edge here -- the database applies
# them at every `Database()` construction, so if they are absent from the wheel
# the daemon does not start at all. "Migration packaging revisit on more
# install paths" is an open BACKLOG item; this closes the wheel half of it.
name: packaging

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Build and publish artifacts for this EXISTING tag, e.g. v1.1.0.
          Leave empty for an ordinary run. This is the recovery path when a
          tag's own release job failed: the workflow file that runs on a tag
          push is the one stored AT that tag, so a fix landed afterwards can
          never reach it.
        required: false
        default: ""

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/

      # ⭐ A CLEAN venv, deliberately. Installing into the build environment
      # would let a dependency that only the dev extra pulls in mask a missing
      # runtime requirement.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/pip list

      # ⚠️ Derived, never transcribed, for the same reason the migration
      # counts below are. This list was hand-written and had gone stale:
      # `lynceus-export-case` shipped without ever being checked here, and
      # every future script would have done the same. Read out of
      # pyproject so a script added to the project is covered with nothing
      # to remember. tests/test_fresh_install.py derives the same set.
      - name: Every console script the project declares exists and runs
        run: |
          set -euo pipefail
          python - > /tmp/scripts.txt <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          names = sorted(data["project"].get("scripts", {}))
          if not names:
              raise SystemExit("pyproject declares no [project.scripts]; "
                               "this gate would be vacuous")
          print("\n".join(names))
          PY
          scripts=$(cat /tmp/scripts.txt)
          echo "checking $(wc -l < /tmp/scripts.txt) declared console scripts"
          for s in $scripts; do
            if [ ! -x "/tmp/clean/bin/$s" ]; then
              echo "::error::console script $s missing from the wheel"; exit 1
            fi
            # --help must exit 0. A script whose module moved fails here with
            # an ImportError instead, which is exactly the regression we want.
            "/tmp/clean/bin/$s" --help > /dev/null || {
              echo "::error::$s --help failed"; exit 1; }
            echo "  ok: $s"
          done

      # ⚠️ Derived, never transcribed. These numbers used to be hardcoded
      # floors (`>= 24`), written when there were 24 migration files. There are
      # now 54, so the floor had silently stopped proving anything: thirty of
      # them could have vanished from the wheel and the gate would still have
      # gone green. Reading the expected values out of the checkout means the
      # gate stays exact as migrations are added, with nothing to remember to
      # bump.
      - name: Derive what the wheel is expected to contain
        run: |
          set -euo pipefail
          sql=$(git ls-files 'src/lynceus/migrations/*.sql' | wc -l | tr -d '[:space:]')
          # Up-migrations only -- `NNN_x_down.sql` is the rollback half and does
          # not advance the schema version.
          ver=$(git ls-files 'src/lynceus/migrations/*.sql' \
                  | sed 's|.*/||' | grep -v '_down\.sql$' \
                  | grep -oE '^[0-9]+' | sort -n | tail -1)
          if [ -z "$sql" ] || [ "$sql" -eq 0 ] || [ -z "$ver" ]; then
            echo "::error::derived 0 migrations from the checkout; the gate would be vacuous"
            exit 1
          fi
          echo "EXPECTED_SQL=$sql"     >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$((10#$ver))" >> "$GITHUB_ENV"
          echo "expecting $sql migration file(s), schema version $ver"

      # The real test: package data. Templates, static assets, the bundled
      # Argus CSV and -- most importantly -- the migrations.
      - name: Packaged data is present and usable
        run: |
          /tmp/clean/bin/python - <<'PY'
          import os, pathlib, sys
          from importlib.resources import files

          failures = []

          def need(pkg, sub, pattern, minimum=1, exact=None):
              try:
                  d = pathlib.Path(str(files(pkg) / sub))
              except (ModuleNotFoundError, TypeError, OSError) as e:
                  failures.append(f"{pkg}/{sub}: cannot resolve ({e})")
                  return []
              if not d.is_dir():
                  failures.append(f"{pkg}/{sub}: not packaged")
                  return []
              found = sorted(d.glob(pattern))
              # `exact` is the strong form: every file the source tree tracks
              # must be in the wheel. A floor only catches total absence.
              if exact is not None and len(found) != exact:
                  failures.append(
                      f"{pkg}/{sub}/{pattern}: {len(found)} packaged, "
                      f"{exact} tracked in the source tree")
              elif exact is None and len(found) < minimum:
                  failures.append(
                      f"{pkg}/{sub}/{pattern}: {len(found)} found, expected >= {minimum}")
              return found

          migrations = need(
              "lynceus", "migrations", "*.sql",
              exact=int(os.environ["EXPECTED_SQL"]))
          need("lynceus.webui", "templates", "*.html", minimum=10)
          need("lynceus.webui", "static", "*", minimum=3)
          need("lynceus.setup.web", "templates", "*.html", minimum=10)
          need("lynceus.data", "", "*.csv", minimum=1)

          print(f"migrations packaged: {len(migrations)}")
          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("all package data present")
          PY

      # ⭐ The end of the chain: build a real database from the INSTALLED
      # package. This is what proves the migrations both shipped and apply --
      # if they are absent the daemon cannot start at all, and no source-tree
      # test would have noticed.
      - name: A database can be built from the installed package
        run: |
          /tmp/clean/bin/python - <<'PY'
          import tempfile, os, sys
          from lynceus.db import Database
          from lynceus import __version__

          db = Database(os.path.join(tempfile.mkdtemp(), "ci.db"))
          version = list(db._conn.execute("SELECT MAX(version) FROM schema_migrations"))[0][0]
          tables = {r[0] for r in db._conn.execute(
              "SELECT name FROM sqlite_master WHERE type='table'")}
          cols = {r[1] for r in db._conn.execute("PRAGMA table_info(alerts)")}
          db.close()

          print(f"lynceus {__version__}, schema version {version}")
          problems = []
          expected_version = int(os.environ["EXPECTED_VERSION"])
          if version is None:
              problems.append("schema version is NULL -- no migration applied at all")
          elif version != expected_version:
              problems.append(
                  f"schema version {version}, expected {expected_version} -- the wheel "
                  "is missing migrations the source tree tracks, or they failed to apply")
          for t in ("alerts", "devices", "sightings", "watchlist"):
              if t not in tables:
                  problems.append(f"missing table: {t}")
          # Pins the delivery-tracking columns specifically. (They were the
          # newest migration when this was written; 024 is no longer the head
          # -- the derived version check above is what covers "the newest one
          # applied". This stays as a named regression guard for the columns
          # the notifier depends on.)
          for c in ("notified_at", "notify_attempts"):
              if c not in cols:
                  problems.append(f"alerts.{c} missing -- migration 024 not packaged")
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("database builds cleanly from the installed wheel")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 14

  # ⭐ v1.0.0 shipped as a bare tag: packaging.yml did not run on tags, so the
  # Release page offered nothing to download and the install path was a clone.
  # This job closes that, and closes it for every future tag rather than for
  # this one, which is the difference between a fix and a chore.
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event.inputs.release_tag != ''
    # ⛔ Gated on the wheel actually working. Publishing an artifact that
    # failed its own packaging gate is worse than publishing none.
    needs: wheel-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The TAG's tree, so a dispatched recovery run builds what the tag
          # actually points at rather than whatever main has drifted to.
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel and the sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/

      - name: The built version matches the tag
        run: |
          set -euo pipefail
          # ⛔ A tag pointing at a tree whose version literals say something
          # else produces a release whose filenames contradict its own name.
          raw="${{ github.event.inputs.release_tag || github.ref_name }}"
          tag="${raw#v}"
          built=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$built" ]; then
            echo "::error::tag is $raw but pyproject says $built"; exit 1
          fi
          echo "tag and pyproject agree: $built"

      - name: Publish the release WITH its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag || github.ref_name }}"

          # ⛔ Assets are attached AT CREATION, in one call. This repository
          # has immutable releases enabled, so adding an asset to a release
          # that already exists fails:
          #
          #   HTTP 422: Cannot upload assets to an immutable release.
          #
          # Measured on v1.1.0, which published with zero assets because the
          # first version of this job created the release and then uploaded.
          # There is no "upload afterwards" to fall back to.
          if gh release view "$tag" >/dev/null 2>&1; then
            have=$(gh release view "$tag" --json assets --jq '[.assets[].name] | length')
            if [ "$have" -gt 0 ]; then
              echo "::notice::$tag already carries $have asset(s); nothing to do"
              exit 0
            fi
            # ⛔ Do NOT delete and recreate. Deleting an immutable release does
            # not free its tag name:
            #
            #   HTTP 422: tag_name was used by an immutable release
            #
            # Measured on v1.1.0. An earlier version of this job did exactly
            # that, and the result was strictly worse than doing nothing: the
            # release page was destroyed and could never be recreated under
            # that name. Refuse instead, and say what the only way forward is.
            echo "::error::$tag already has a release with no assets attached."
            echo "::error::Under immutable releases that name is spent: assets"
            echo "::error::cannot be added, and deleting the release does NOT"
            echo "::error::free the name. Cut a new patch tag and release that."
            exit 1
          fi
          gh release create "$tag" --title "$tag" --notes-from-tag --verify-tag dist/*

      - name: The release actually carries both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⛔ `gh release upload` exiting 0 is not evidence that anything is
          # attached. Read the release back and require both kinds.
          tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "$names"
          echo "$names" | grep -q '\.whl$'    || { echo "::error::no wheel attached"; exit 1; }
          echo "$names" | grep -q '\.tar\.gz$' || { echo "::error::no sdist attached"; exit 1; }
          echo "release carries a wheel and an sdist"
