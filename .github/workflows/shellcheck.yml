# Shell linting for the installers.
#
# ⚠️ Why this exists: install.sh is 576 lines of bash and is the FIRST thing a
# stranger runs, on a machine they care about, often with sudo. It had no
# automated checking of any kind. The Python suite is ~3,280 tests; the shell
# was zero.
#
# It found a real (if small) defect on its first run -- a `local run_step`
# declared and never used -- which is exactly the class of thing that rots
# quietly in a script nobody lints. Both files are clean at -S warning, so this
# gate is meaningful rather than pre-broken.
name: shellcheck

on:
  push:
    branches: [main]
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  workflow_dispatch:

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      # Severity `warning`, not `style`. Style would flood the log with
      # opinions about quoting idioms this script uses deliberately, and a gate
      # people learn to ignore is worse than no gate.
      - name: Lint shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          # Fail loudly rather than silently pass on an empty list -- a glob
          # that stops matching would otherwise look like success.
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found; this gate would prove nothing"
            exit 1
          fi
          shellcheck -S warning "${scripts[@]}"

      # bash -n catches syntax errors shellcheck can miss in edge cases, and
      # costs nothing.
      - name: Parse-check every script
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
          echo "all scripts parse"

  # ⭐ Linting proves the script parses. This proves it RUNS. install.sh has
  # `--dry-run`, where `run()` prints each command instead of executing it, so
  # the whole decision tree -- scope detection, path resolution, unit
  # placement, the next-steps output -- is exercised end to end without
  # touching the machine. That is most of the installer's actual logic, and
  # none of it had ever been executed by anything but a human.
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: --help exits cleanly
        run: bash install.sh --help

      - name: User install, dry run
        run: |
          out=$(bash install.sh --user --dry-run)
          echo "$out"
          # A dry run that silently did nothing would pass a bare exit-code
          # check, so assert it actually planned work.
          echo "$out" | grep -q 'DRY-RUN:' || {
            echo "::error::--user --dry-run planned no commands"; exit 1; }
          # ⚠️ --user must NOT touch systemd. The README once told readers to
          # install --user and then `systemctl enable`, which cannot work
          # because --user installs no units (Wave 5, Finding 17).
          #
          # Scoped to `DRY-RUN:` lines -- the PLANNED COMMANDS -- and not the
          # whole output. The next-steps prose legitimately says
          # `sudo systemctl start kismet` as advice, and grepping everything
          # flags that as a violation. Verified locally: 0 planned commands
          # touch systemd, 1 advisory line mentions it.
          if echo "$out" | grep '^DRY-RUN:' | grep -qi 'systemctl\|/etc/systemd'; then
            echo "::error::--user planned systemd work; it installs no units"
            echo "$out" | grep '^DRY-RUN:' | grep -i 'systemctl\|/etc/systemd'
            exit 1
          fi

      # --system in dry-run deliberately does not require root, so CI can
      # exercise the privileged path without being privileged.
      - name: System install, dry run
        run: |
          out=$(bash install.sh --system --dry-run)
          echo "$out"
          echo "$out" | grep -q 'DRY-RUN:' || {
            echo "::error::--system --dry-run planned no commands"; exit 1; }
          echo "$out" | grep -q '/etc/systemd/system' || {
            echo "::error::--system planned no systemd unit install"; exit 1; }

      - name: Uninstall paths, dry run
        run: |
          bash install.sh --user --uninstall --dry-run
          bash install.sh --system --uninstall --dry-run

      - name: An unknown flag fails loudly
        run: |
          if bash install.sh --definitely-not-a-flag >/dev/null 2>&1; then
            echo "::error::install.sh accepted an unknown flag"; exit 1
          fi
          echo "unknown flags rejected"
