[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynceus"
version = "1.0.0"
description = "Personal RF security monitoring platform for Raspberry Pi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Kev Wilson", email = "kev@gurutechnology.services" },
]
keywords = [
    "security",
    "rf",
    "wifi",
    "bluetooth",
    "kismet",
    "raspberry-pi",
    "monitoring",
    "ntfy",
    "surveillance-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "requests>=2.34.2",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.52.1,<1.0",
    "jinja2>=3.1.6,<4.0",
    "python-multipart>=0.0.32,<1.0",
]

[project.optional-dependencies]
# Passive BLE bridge (config: ble_bridge.enabled, default false). Kept out of
# the base dependencies because the bridge ships off and pulls a D-Bus/BlueZ
# stack that a Kismet-only deployment never touches. Without this extra an
# enabled bridge starts, logs one warning, and captures nothing -- which is
# what lynceus.ble_bridge_checks.check_bleak_available exists to report.
#
# bleak needs BlueZ >= 5.55 for the passive AdvertisementMonitor path the
# bridge scans with; that is a runtime requirement pip cannot express.
# bridges/ble.py imports BlueZScannerArgs/OrPattern from the modern
# `bleak.args.bluez` location and falls back to the legacy
# `bleak.backends.bluezdbus.*` one, so both layouts work.
ble = [
    "bleak>=3.0.2,<4.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    # Coverage is measurement, not a gate on quality -- see the note on
    # `--cov-fail-under` in .github/workflows/ci.yml. Kept in `dev` rather than
    # a separate extra so `make install` gives a contributor the same tooling
    # CI has, and `pytest --cov` works from a fresh clone without a second
    # install step.
    "pytest-cov>=7.0",
    "httpx>=0.28.1",
    "freezegun>=1.5.5",
    "ruff>=0.16.2",
    "build>=1.5.0",
]

[project.scripts]
lynceus = "lynceus.poller:main"
lynceus-seed-watchlist = "lynceus.cli.seed_watchlist:main"
lynceus-import-argus = "lynceus.cli.import_argus:main"
lynceus-ui = "lynceus.webui.server:main"
lynceus-quickstart = "lynceus.cli.quickstart:main"
lynceus-setup = "lynceus.cli.setup:main"
lynceus-validate = "lynceus.cli.validate:main"
lynceus-bootstrap-kismet = "lynceus.cli.bootstrap_kismet:main"
lynceus-export-config = "lynceus.cli.export_config:main"

[project.urls]
Homepage = "https://github.com/kevwillow/lynceus-warden"
Repository = "https://github.com/kevwillow/lynceus-warden"
Issues = "https://github.com/kevwillow/lynceus-warden/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lynceus*"]

[tool.setuptools.package-data]
lynceus = [
    "demo/*.json",
    "migrations/*.sql",
    "webui/templates/*.html",
    "webui/static/*",
    # ⚠️ The glob above is single-level, so it does NOT reach this directory.
    # A self-hosted font left out of the wheel fails in the one place nobody
    # looks: the installed product renders in a fallback mono while every dev
    # checkout looks correct. tests/test_webui_assets.py asserts that every
    # asset the CSS references is covered by one of these patterns.
    "webui/static/fonts/*",
    "setup/web/templates/*.html",
]
"lynceus.data" = [
    "*.csv",
    "*.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -m 'not diagnostic and not browser and not install'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that build a wheel or do other slow setup",
    "webui: tests that exercise the FastAPI app",
    "diagnostic: pre-push observation-only tests; dump actual behavior, don't assert content. Excluded from default suite -- run explicitly with `pytest -m diagnostic`.",
    "browser: drives a real Chromium via playwright. Needs a browser and the playwright package, neither of which is a dependency of lynceus or present on a stock CI runner. Excluded from the default suite -- run explicitly with `pytest -m browser`.",
    "install: builds the wheel and drives the whole new-user path, wizard included. Needs a machine with at least one capture interface, which a stock CI runner does not have. Excluded from the default suite -- run explicitly with `pytest -m install`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form"]
