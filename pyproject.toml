[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynceus"
version = "0.9.4"
description = "Personal RF security monitoring platform for Raspberry Pi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Kev Wilson", email = "kev@gurutechnology.services" },
]
keywords = [
    "security",
    "rf",
    "wifi",
    "bluetooth",
    "kismet",
    "raspberry-pi",
    "monitoring",
    "ntfy",
    "surveillance-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
# Passive BLE bridge (config: ble_bridge.enabled, default false). Kept out of
# the base dependencies because the bridge ships off and pulls a D-Bus/BlueZ
# stack that a Kismet-only deployment never touches. Without this extra an
# enabled bridge starts, logs one warning, and captures nothing -- which is
# what lynceus.ble_bridge_checks.check_bleak_available exists to report.
#
# bleak needs BlueZ >= 5.55 for the passive AdvertisementMonitor path the
# bridge scans with; that is a runtime requirement pip cannot express.
# bridges/ble.py imports BlueZScannerArgs/OrPattern from the modern
# `bleak.args.bluez` location and falls back to the legacy
# `bleak.backends.bluezdbus.*` one, so both layouts work.
ble = [
    "bleak>=0.22,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "freezegun>=1.5",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
lynceus = "lynceus.poller:main"
lynceus-seed-watchlist = "lynceus.cli.seed_watchlist:main"
lynceus-import-argus = "lynceus.cli.import_argus:main"
lynceus-ui = "lynceus.webui.server:main"
lynceus-quickstart = "lynceus.cli.quickstart:main"
lynceus-setup = "lynceus.cli.setup:main"
lynceus-validate = "lynceus.cli.validate:main"
lynceus-bootstrap-kismet = "lynceus.cli.bootstrap_kismet:main"
lynceus-export-config = "lynceus.cli.export_config:main"

[project.urls]
Homepage = "https://github.com/kevwillow/lynceus-warden"
Repository = "https://github.com/kevwillow/lynceus-warden"
Issues = "https://github.com/kevwillow/lynceus-warden/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lynceus*"]

[tool.setuptools.package-data]
lynceus = [
    "migrations/*.sql",
    "webui/templates/*.html",
    "webui/static/*",
    "setup/web/templates/*.html",
]
"lynceus.data" = [
    "*.csv",
    "*.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -m 'not diagnostic'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that build a wheel or do other slow setup",
    "webui: tests that exercise the FastAPI app",
    "diagnostic: pre-push observation-only tests; dump actual behavior, don't assert content. Excluded from default suite -- run explicitly with `pytest -m diagnostic`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form"]
